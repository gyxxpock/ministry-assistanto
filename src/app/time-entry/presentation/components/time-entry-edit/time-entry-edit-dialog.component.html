<!-- Dialog Template -->
<h2 mat-dialog-title>
  {{ (isEditMode ? 'timeEntry.editTitle' : 'timeEntry.createTitle') | translate }}
</h2>

<mat-dialog-content>
  <ma-time-entry-form
    #timeForm
    [entry]="entry"
    [initialDate]="initialDate"
    (save)="onSave($event)"
    (cancel)="onCancel()"
  ></ma-time-entry-form>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  <!-- Panel de confirmación — en footer sticky, siempre visible en iOS -->
  <div *ngIf="showDeleteConfirm" class="delete-confirm-panel">
    <mat-icon color="warn">warning</mat-icon>
    <span>{{ 'timeEntry.deleteConfirmMessage' | translate }}</span>
  </div>

  <!-- Fila de botones -->
  <div class="dialog-actions__row">
    <!-- Zona izquierda: botón eliminar (solo en modo edición) -->
    <div class="dialog-actions__left">
      <button
        *ngIf="isEditMode && !showDeleteConfirm"
        mat-stroked-button
        color="warn"
        (click)="onDeleteRequest()">
        <mat-icon>delete</mat-icon>
        {{ 'common.buttons.delete' | translate }}
      </button>

      <button
        *ngIf="showDeleteConfirm"
        mat-flat-button
        color="warn"
        (click)="onDeleteConfirm()">
        <mat-icon>delete_forever</mat-icon>
        {{ 'common.buttons.confirm' | translate }}
      </button>
    </div>

    <!-- Zona derecha: cancelar / guardar -->
    <div class="dialog-actions__right">
      <button mat-button (click)="showDeleteConfirm ? onDeleteCancel() : onCancel()">
        {{ 'common.buttons.cancel' | translate }}
      </button>

      <button
        *ngIf="!showDeleteConfirm"
        mat-flat-button
        color="primary"
        [disabled]="!timeForm.canSubmit"
        (click)="timeForm.submit()">
        <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
        {{ (isEditMode ? 'common.buttons.save' : 'common.buttons.add') | translate }}
      </button>
    </div>
  </div>
</mat-dialog-actions>
