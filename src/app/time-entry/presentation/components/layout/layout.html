<div class="layout-wrapper" (scroll)="onScroll($event)" [class.nav-is-hidden]="!navVisible()">

    <!-- Capa de Contenido -->
    <main class="content-container">
        <div class="router-wrapper">
            <router-outlet></router-outlet>
        </div>
    </main>

    <!-- Banner de actualización PWA (z-index > backup banner) -->
    @if (showUpdateBanner()) {
      <div class="update-banner-wrapper">
        <ma-update-banner
          [changes]="updateChanges()"
          (applyUpdate)="handleUpdateApply()"
          (dismiss)="handleUpdateDismiss()">
        </ma-update-banner>
      </div>
    }

    <!-- Banner de recordatorio de respaldo (posicionado sobre el nav) -->
    @if (showBanner()) {
      <div class="backup-banner-wrapper">
        <ma-backup-reminder-banner (doBackup)="handleBannerBackup()"></ma-backup-reminder-banner>
      </div>
    }

    <!-- Menú Flotante Inferior -->
    <nav class="floating-nav" [class.nav-hidden]="!navVisible()">
        <mat-toolbar class="bottom-toolbar">
            <button mat-button routerLink="/time-entry/list" routerLinkActive="active-link">
                <mat-icon>format_list_bulleted</mat-icon>
                <span class="label">{{ 'timeEntry.pages.list.title' | translate }}</span>
            </button>

            <button mat-button routerLink="/time-entry/calendar" routerLinkActive="active-link">
                <mat-icon>date_range</mat-icon>
                <span class="label">{{ 'timeEntry.pages.calendar.title' | translate }}</span>
            </button>

            <button mat-button routerLink="/time-entry/settings" routerLinkActive="active-link">
                <mat-icon>settings</mat-icon>
                <span class="label">{{ 'timeEntry.pages.settings.title' | translate }}</span>
            </button>
        </mat-toolbar>
    </nav>
</div>
